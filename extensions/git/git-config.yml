# Git Extension Configuration
# Controls auto-commit behavior and branch settings for Speckit hooks.

# Branch numbering mode — must match .specify/init-options.json
branch_numbering: sequential

# Auto-commit settings per hook event
auto_commit:
  default: false
  after_specify:
    enabled: true
    message: "chore(specs): add feature specification"
  after_clarify:
    enabled: true
    message: "chore(specs): clarify specification"
  after_plan:
    enabled: true
    message: "chore(plan): add implementation plan"
  after_tasks:
    enabled: true
    message: "chore(tasks): generate task list"
  after_implement:
    enabled: true
    message: "feat: implement feature"
  after_constitution:
    enabled: true
    message: "docs: update constitution"
  after_checklist:
    enabled: false
  after_analyze:
    enabled: false
  after_taskstoissues:
    enabled: false
